<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureWallet | Fraud review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
    <header class="topbar">
        <a class="brand" href="admin.html">
            <img class="brand-logo" src="img/webmasters-logo.png" alt="Webmasters">
            <span class="brand-divider" aria-hidden="true"></span>
            <span class="brand-product">SecureWallet</span>
        </a>
        <div class="who">
            <span id="userName"></span>
            <button id="logoutButton" class="quiet" type="button">Log out</button>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <span class="mono">Fraud operations</span>
            <h1 style="margin-top:10px">Fraud review</h1>
            <p>Transfers and withdrawals the model scored at or above the alert threshold. The money has already moved; your decision records whether the transaction was fraud.</p>
        </div>

        <div class="stats">
            <div class="console stat"><span class="mono"><span class="dot ok"></span>Waiting</span><div class="num" id="stat-pending">0</div></div>
            <div class="console stat"><span class="mono"><span class="dot bad"></span>Confirmed fraud</span><div class="num" id="stat-confirmed_fraud">0</div></div>
            <div class="console stat"><span class="mono"><span class="dot safe"></span>Dismissed</span><div class="num" id="stat-cleared">0</div></div>
            <div class="console stat"><span class="mono">Scoring model</span><div class="num small" id="scoringStatus"><span class="dot idle"></span>Checking</div></div>
        </div>

        <div class="tabs" role="tablist" aria-label="Alert status">
            <button type="button" role="tab" aria-selected="true" data-status="pending">Waiting for review <span class="count" id="count-pending">0</span></button>
            <button type="button" role="tab" aria-selected="false" data-status="confirmed_fraud">Confirmed fraud <span class="count" id="count-confirmed_fraud">0</span></button>
            <button type="button" role="tab" aria-selected="false" data-status="cleared">Dismissed <span class="count" id="count-cleared">0</span></button>
        </div>

        <p id="adminMessage" class="message" role="status" aria-live="polite"></p>
        <ul id="alertList" class="alerts" aria-live="polite"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
